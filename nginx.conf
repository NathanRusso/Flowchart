worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server_tokens off;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Serves HTML, CSS, JS, images, etc.
        location / {
            try_files $uri $uri/ =404;
        }

        location /json/templates/ {
            alias /usr/share/nginx/html/templates/;
        }

        # Forward API requests to Flask/Gunicorn backend
        location /api/ {
            # Send API traffic to Gunicorn running on port 8000
            proxy_pass http://127.0.0.1:8000;

            # Use HTTP/1.1 for backend communication
            proxy_http_version 1.1;

            # Preserve original request information
            proxy_set_header Host $host;                                    # Original hostname
            proxy_set_header X-Real-IP $remote_addr;                        # Client IP address
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;    # Proxy chain
            proxy_set_header X-Forwarded-Proto $scheme;                     # Original HTTP/HTTPS protocol
        }
    }
}
